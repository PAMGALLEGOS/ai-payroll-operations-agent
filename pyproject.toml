[project]
name = "ai-payroll-agent"
version = "0.1.0"
description = "Academic PoC — AI Payroll Operations & Validation Agent (synthetic data only)"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Evaluation tests call real Gemini; they never run by default (use: pytest -m eval).
addopts = "-m 'not eval'"
markers = [
    "eval: evaluation against real Gemini (requires GEMINI_API_KEY)",
]
filterwarnings = [
    # Starlette's TestClient announces a future switch of HTTP library; not relevant to the PoC.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
