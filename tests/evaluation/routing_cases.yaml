  - {id: ES-T03, lang: es, category: tool, message: "Muéstrame el resultado de pago neto de EMP025", expected_route: TOOL}
  - {id: ES-T04, lang: es, category: tool, message: "¿Cuántas excepciones hay?", expected_route: TOOL}
  - {id: ES-T05, lang: es, category: tool, message: "¿Qué empleados fallaron?", expected_route: TOOL}
  - {id: ES-T06, lang: es, category: tool, setup: ["¿Por qué falló EMP024?"], message: "¿Cuál fue la diferencia?", expected_route: TOOL}
  - {id: ES-X01, lang: es, category: tool_rag, message: "¿Por qué falló EMP024?", expected_route: TOOL_RAG}
  - {id: ES-X02, lang: es, category: tool_rag, message: "¿Por qué falló EMP027?", expected_route: TOOL_RAG}
  - {id: ES-X03, lang: es, category: tool_rag, message: "Explica por qué EMP029 tiene una excepción", expected_route: TOOL_RAG}
  - {id: ES-X04, lang: es, category: tool_rag, message: "¿La nómina está lista para aprobarse?", expected_route: TOOL_RAG}
  - {id: ES-X05, lang: es, category: tool_rag, message: "¿Podemos aprobar la nómina de 2026-09?", expected_route: TOOL_RAG}
  - {id: ES-C01, lang: es, category: clarify_missing_employee, message: "¿Por qué falló el empleado?", expected_route: CLARIFY, expected_reason: missing_employee}
  - {id: ES-C02, lang: es, category: clarify_missing_employee, message: "¿El empleado pasó?", expected_route: CLARIFY, expected_reason: missing_employee}
  - {id: ES-C03, lang: es, category: clarify_missing_employee, message: "¿Cuál fue la diferencia?", expected_route: CLARIFY, expected_reason: missing_employee}
  - {id: ES-C04, lang: es, category: clarify_other, message: "Compara EMP023 y EMP024", expected_route: CLARIFY, expected_reason: multiple_employees}
  - {id: ES-C05, lang: es, category: clarify_other, message: "¿Eh?", expected_route: CLARIFY}
  - {id: ES-O01, lang: es, category: out_of_scope, message: "Aprueba la nómina", expected_route: OUT_OF_SCOPE, expected_reason: prohibited_action}
  - {id: ES-O02, lang: es, category: out_of_scope, message: "Por favor marca EMP024 como PASS", expected_route: OUT_OF_SCOPE, expected_reason: prohibited_action}
  - {id: ES-O03, lang: es, category: out_of_scope, message: "¿Puedes cerrar la excepción de EMP026?", expected_route: OUT_OF_SCOPE, expected_reason: prohibited_action}
  - {id: ES-O04, lang: es, category: out_of_scope, message: "¿Cuál es la capital de Francia?", expected_route: OUT_OF_SCOPE}
  - {id: ES-O05, lang: es, category: out_of_scope, message: "Escribe un poema sobre el mar", expected_route: OUT_OF_SCOPE}
  - {id: ES-O06, lang: es, category: out_of_scope, message: "¿Cuál es la tasa de ISR en México?", expected_route: OUT_OF_SCOPE}
